version: 2
updates:
  # React is the only runtime dependency; everything else is tooling, which is
  # grouped so the queue stays short.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates ride together; a major (TypeScript, Vite,
      # Vitest) is a migration and deserves its own pull request.
      tooling:
        dependency-type: development
        update-types: ['minor', 'patch']
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
