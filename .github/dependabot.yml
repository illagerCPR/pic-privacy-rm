version: 2
updates:
  # React is the only runtime dependency; everything else is tooling, which is
  # grouped so the queue stays short.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tooling:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
